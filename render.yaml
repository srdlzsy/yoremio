services:
  - type: web
    name: yoremio-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: "Production"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: "yoremio-api"
      - key: Jwt__Audience
        value: "yoremio-client"
      - key: Jwt__ExpireMinutes
        value: "60"
      - key: Startup__ApplyMigrations
        value: "true"
      - key: Startup__SeedSampleData
        value: "false"
      - key: Verification__RequireConfirmedPhoneForSellerLogin
        value: "true"
      - key: Verification__PublicBaseUrl
        sync: false
      - key: Email__Smtp__UseMockSender
        value: "true"
      - key: Sms__Twilio__UseMockSender
        value: "true"
      - key: Cloudinary__Enabled
        sync: false
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cloudinary__UploadFolder
        value: "yoremio"
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Cors__AllowedOrigins__1
        value: "http://localhost:3000"
      - key: Cors__AllowedOrigins__2
        value: "https://localhost:3000"
